name: lighthouse

on:
  pull_request:

# Least privilege: the audit only reads the repository and uploads an artifact.
# Artifact upload authenticates with the job's runtime token, not the
# GITHUB_TOKEN, so `contents: read` is both necessary and sufficient here — no
# `actions: write` is required.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full 40-char commit SHA with a version comment; Dependabot
      # (.github/dependabot.yml) proposes updates as reviewable PRs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Export static site
        run: npm run export

      - name: Run Lighthouse CI
        run: |
          npx --yes @lhci/cli@0.15.x autorun

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-audit
          path: |
            lhci-artifacts/
          if-no-files-found: warn
          retention-days: 30
